# ==========================================
# Base de Datos Neon PostgreSQL (Nube)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-little-field-b5zv8xgo-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Parámetros de Seguridad JWT
# ==========================================
jwt.secret=${JWT_SECRET:jwt-secret-placeholder-for-dev-only-32bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# ==========================================
# Configuración CORS y Dominios Permitidos
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080,http://localhost,https://localhost,capacitor://localhost,ionic://localhost,https://mantenimiento-vehiculos-pro.web.app,https://mantenimiento-vehiculos-pro.firebaseapp.com}

# ==========================================
# Blindaje de Subida de Archivos (Anti DoS de almacenamiento)
# ==========================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# JPA / Hibernate PostgreSQL
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.dialect.Dialect=ERROR

server.address=0.0.0.0
server.port=${PORT:8080}
